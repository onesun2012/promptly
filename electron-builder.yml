# AppId is permanent once released (lesson from bragi: never change it after v1)
appId: com.onesun2012.promptly
productName: Promptly
copyright: Copyright © 2026 onesun2012

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierrc,dev-app-update.yml,CHANGELOG.md,README.md}"

asar: true
# Electron 44 embeds Node 24 — same ABI as our better-sqlite3 prebuild, no rebuild needed
npmRebuild: false

# hardening: block env/CLI injection paths into the packaged app
# (embeddedAsarIntegrity left off: meaningful with code signing, planned v1.1)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true

extraResources:
  # native selection helper (compiled from src/helper by npm run build:helper)
  - from: build/helper
    to: helper
    filter:
      - "*.exe"
  - from: build/tray.png
    to: tray.png
  - from: build/icon.png
    to: icon.png
  - from: build/icon-small.png
    to: icon-small.png

# electron-updater feed: releases + latest.yml live on GitHub Releases
publish:
  provider: github
  owner: onesun2012
  repo: promptly

win:
  target:
    - target: nsis
      arch:
        - x64
  # png ≥256px; electron-builder converts to .ico for exe/installer
  icon: build/icon.png

nsis:
  include: build/installer.nsh
  # per-user install into %LOCALAPPDATA%\Programs, no admin required (SPEC constraint)
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # follow bragi lesson: desktop icon opt-in, start menu always
  createDesktopShortcut: false
  deleteAppDataOnUninstall: false

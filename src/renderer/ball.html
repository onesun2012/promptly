<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Promptly</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      .ball {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #171a21;
        border: 1px solid #2a2f3a;
        box-shadow:
          0 0 14px rgba(124, 92, 255, 0.35),
          0 2px 8px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: grab;
        opacity: 0.92;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ball:hover {
        opacity: 1;
        transform: scale(1.08);
        box-shadow:
          0 0 20px rgba(124, 92, 255, 0.55),
          0 2px 10px rgba(0, 0, 0, 0.5);
      }
      .ball:active {
        cursor: grabbing;
        transform: scale(0.96);
      }
      .mark {
        width: 34px;
        height: 34px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ball" class="ball">
      <!-- brand mark: selection box + P + AI spark -->
      <svg class="mark" viewBox="0 0 48 48" aria-label="Promptly">
        <rect
          x="10"
          y="10"
          width="28"
          height="28"
          rx="7"
          fill="none"
          stroke="#7C5CFF"
          stroke-width="2.4"
          stroke-dasharray="9 5"
        />
        <text
          x="21"
          y="32"
          font-family="Segoe UI, system-ui, sans-serif"
          font-size="20"
          font-weight="700"
          fill="#E8EAED"
          text-anchor="middle"
        >
          P
        </text>
        <path
          d="M36 6 L37.6 10.4 L42 12 L37.6 13.6 L36 18 L34.4 13.6 L30 12 L34.4 10.4 Z"
          fill="#7C5CFF"
        />
      </svg>
    </div>
    <script type="module" src="/src/ball/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Promptly</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
      .ball {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe9c7 0%, #ffd39b 55%, #f5b45e 100%);
        box-shadow: 0 3px 10px rgba(180, 120, 40, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        user-select: none;
        border: 2px solid rgba(255, 255, 255, 0.9);
        overflow: hidden;
      }
      .mark {
        -webkit-app-region: no-drag;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
      }
      .mark:active {
        transform: scale(0.94);
      }
    </style>
  </head>
  <body>
    <div id="ball" class="ball">
      <svg class="mark" viewBox="0 0 48 48" aria-label="Promptly cat">
        <!-- ears -->
        <path d="M11 16 L8.5 4.5 L20 10.5 Z" fill="#F0A35C" stroke="#C97F3D" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M37 16 L39.5 4.5 L28 10.5 Z" fill="#F0A35C" stroke="#C97F3D" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M12.5 13.5 L11.2 8 L16.5 11 Z" fill="#FFD9AD"/>
        <path d="M35.5 13.5 L36.8 8 L31.5 11 Z" fill="#FFD9AD"/>
        <!-- face -->
        <circle cx="24" cy="27" r="16.5" fill="#FFC97A" stroke="#C97F3D" stroke-width="1.2"/>
        <!-- stripes -->
        <path d="M20 11.5 Q24 10 28 11.5" stroke="#E8964B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- eyes -->
        <circle cx="17.2" cy="24.5" r="2.4" fill="#2B2420"/>
        <circle cx="30.8" cy="24.5" r="2.4" fill="#2B2420"/>
        <circle cx="18" cy="23.7" r="0.8" fill="#FFFFFF"/>
        <circle cx="31.6" cy="23.7" r="0.8" fill="#FFFFFF"/>
        <!-- nose + mouth -->
        <path d="M22.2 29.6 L25.8 29.6 L24 31.8 Z" fill="#E2705B"/>
        <path d="M24 31.8 Q24 34 21.5 34.2 M24 31.8 Q24 34 26.5 34.2" stroke="#2B2420" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        <!-- whiskers -->
        <path d="M8 26 L14 27 M8.5 30 L14.5 29.5" stroke="#C97F3D" stroke-width="1" stroke-linecap="round"/>
        <path d="M40 26 L34 27 M39.5 30 L33.5 29.5" stroke="#C97F3D" stroke-width="1" stroke-linecap="round"/>
        <!-- blush -->
        <ellipse cx="14.5" cy="30" rx="2.2" ry="1.3" fill="#FFAD8A" opacity="0.7"/>
        <ellipse cx="33.5" cy="30" rx="2.2" ry="1.3" fill="#FFAD8A" opacity="0.7"/>
      </svg>
    </div>
    <script type="module" src="/src/ball/main.ts"></script>
  </body>
</html>

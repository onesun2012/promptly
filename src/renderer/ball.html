<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Promptly</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        /* keep in sync with WINDOW_SIZE in src/main/ball.ts */
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ball {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--surface);
        /* Doubao-style light ring: keeps the dark ball readable on dark backgrounds */
        border: 2.5px solid rgba(255, 255, 255, 0.9);
        /* subtle 3D bevel — inset shadows stay inside the circle */
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.16),
          inset 0 -3px 6px rgba(0, 0, 0, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        cursor: grab;
        /* idle: low presence (design spec) */
        opacity: 0.7;
        transition:
          opacity 0.15s ease,
          filter 0.15s ease,
          box-shadow 0.15s ease;
      }
      .ball:hover {
        opacity: 1;
        filter: brightness(1.25);
        box-shadow:
          inset 0 2px 3px rgba(255, 255, 255, 0.16),
          inset 0 -3px 6px rgba(0, 0, 0, 0.55),
          0 0 10px var(--accent-soft);
      }
      .ball.dragging {
        cursor: grabbing;
        opacity: 1;
        box-shadow: var(--shadow-ball-drag);
      }
      .mark {
        width: 30px;
        height: 30px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ball" class="ball">
      <!-- brand mark: selection box + P + AI spark -->
      <svg class="mark" viewBox="0 0 48 48" aria-label="Promptly">
        <rect
          x="10"
          y="10"
          width="28"
          height="28"
          rx="7"
          fill="none"
          stroke="#7C5CFF"
          stroke-width="2.4"
          stroke-dasharray="9 5"
        />
        <text
          x="21"
          y="32"
          font-family="Segoe UI, system-ui, sans-serif"
          font-size="20"
          font-weight="700"
          fill="#E8EAED"
          text-anchor="middle"
        >
          P
        </text>
        <path
          d="M36 6 L37.6 10.4 L42 12 L37.6 13.6 L36 18 L34.4 13.6 L30 12 L34.4 10.4 Z"
          fill="#7C5CFF"
        />
      </svg>
    </div>
    <script type="module" src="/src/ball/main.ts"></script>
  </body>
</html>

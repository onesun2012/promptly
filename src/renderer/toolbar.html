<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Promptly</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
      }
      body {
        margin: 0;
        background: transparent;
        user-select: none;
      }
      .toolbar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow-toolbar);
        padding: 8px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .toolbar.appear {
        animation: appear 0.12s ease-out;
      }
      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .brand {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .spark {
        color: var(--accent);
        font-size: 11px;
      }
      .spacer {
        flex: 1;
      }
      .badge {
        font-size: 10px;
        color: var(--success);
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .badge.warn {
        color: #d29922;
      }
      .iconbtn {
        border: none;
        background: transparent;
        color: var(--text-2);
        font-size: 12px;
        cursor: pointer;
        padding: 2px 5px;
        border-radius: 5px;
      }
      .iconbtn:hover {
        color: var(--text);
        background: var(--surface-2);
      }
      .snippet {
        font-size: 11px;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 2px;
      }
      .airow {
        display: flex;
        gap: 5px;
      }
      /* primary action: solid accent */
      .airow .ai {
        flex: 1;
        font-size: 12px;
        padding: 5px 4px;
        border-radius: var(--radius-btn);
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #ffffff;
        cursor: pointer;
      }
      .airow .ai:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      /* secondary action: ghost/outline */
      .airow .ai.ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
      }
      .airow .ai.ghost:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      /* result header copy button: highest weight */
      .copybtn {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: var(--radius-btn);
        background: var(--accent);
        border: 1px solid var(--accent);
        color: #ffffff;
        cursor: pointer;
      }
      .copybtn:hover {
        background: var(--accent-hover);
      }
      .loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 0 2px;
      }
      .loading .hint {
        font-size: 11px;
        color: var(--text-2);
      }
      .dots {
        display: flex;
        gap: 5px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce 0.9s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 5px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-3);
        background-clip: content-box;
      }
      .resultwrap {
        overflow-y: auto;
        max-height: 240px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        user-select: text;
        padding: 0 2px;
      }
      .err {
        color: var(--danger);
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .ghostbtn {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: var(--radius-btn);
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-2);
        cursor: pointer;
      }
      .ghostbtn:hover {
        background: var(--surface-2);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/toolbar/main.ts"></script>
  </body>
</html>

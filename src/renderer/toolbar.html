<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Promptly</title>
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        /* Promptly design tokens (UI v0.2) */
        --bg: #0f1115;
        --surface: #171a21;
        --border: #2a2f3a;
        --text: #e8eaed;
        --muted: #8b93a1;
        --accent: #7c5cff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: var(--text);
      }
      body {
        margin: 0;
        background: transparent;
        user-select: none;
      }
      .toolbar {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
        padding: 8px 10px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .brand {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .spark {
        color: var(--accent);
        font-size: 11px;
      }
      .spacer {
        flex: 1;
      }
      .badge {
        font-size: 10px;
        color: #3fb950;
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .badge.warn {
        color: #d29922;
      }
      .iconbtn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        padding: 1px 4px;
        border-radius: 5px;
      }
      .iconbtn:hover {
        color: var(--text);
        background: #21262f;
      }
      .snippet {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 0 2px;
      }
      .airow {
        display: flex;
        gap: 5px;
      }
      .airow .ai {
        flex: 1;
        font-size: 12px;
        padding: 5px 4px;
        background: #1d222b;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .airow .ai.primary {
        border-color: var(--accent);
        color: #c9b8ff;
      }
      .loading {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce 0.9s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      .resultwrap {
        flex: 1;
        overflow-y: auto;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        user-select: text;
      }
      .err {
        color: #f85149;
      }
      .airow .ai:hover {
        background: #262c38;
      }
      .airow .ai.primary:hover {
        background: #2a2440;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/toolbar/main.ts"></script>
  </body>
</html>
